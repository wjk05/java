---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/app.yaml
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: app
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/app.yaml
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: app
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - env:
            - name: AI_BAILIAN_API_KEY
              value: sk-5edc4eb35a01492386fc851c2763a2b2
            - name: AI_DEFAULT_PROVIDER
              value: third-party
            - name: AI_EMBEDDING_MODEL
              value: text-embedding-v3
            - name: APP_INTERVIEW_EVALUATION_BATCH_SIZE
              value: "8"
            - name: APP_INTERVIEW_FOLLOW_UP_COUNT
              value: "1"
            - name: APP_STORAGE_ACCESS_KEY
              value: minioadmin
            - name: APP_STORAGE_BUCKET
              value: ruici-ai-platform
            - name: APP_STORAGE_ENDPOINT
              value: http://minio:9000
            - name: APP_STORAGE_REGION
              value: us-east-1
            - name: APP_STORAGE_SECRET_KEY
              value: minioadmin
            - name: POSTGRES_DB
              value: ruici_ai_platform
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: postgres
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: THIRD_PARTY_API_KEY
              value: sk-5edc4eb35a01492386fc851c2763a2b2
            - name: THIRD_PARTY_BASE_URL
              value: https://api-s.zwenooo.link/v1
            - name: THIRD_PARTY_MODEL
              value: gpt5.2
          image: wjktime/ruici-ai-platform-master-app
          name: ruici-app
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      restartPolicy: Always

---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/app.yaml
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: createbuckets
  name: createbuckets
spec:
  #replicas: 1
  #selector:
  # matchLabels:
  #   io.kompose.service: createbuckets
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/app.yaml
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: createbuckets
    spec:
      containers:
        - command:
            - /bin/sh
            - -c
            - ' # 1. 配置 MinIO 客户端别名 (myminio) 连接到 minio 服务 /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; # 2. 创建名为 ruici-ai-platform 的存储桶 /usr/bin/mc mb myminio/ruici-ai-platform; # 3. 设置该存储桶为公共读权限（方便前端直接访问图片等资源） /usr/bin/mc anonymous set public myminio/ruici-ai-platform; exit 0; '
          image: minio/mc
          name: createbuckets
      restartPolicy: Never

---
apiVersion: apps/v1
