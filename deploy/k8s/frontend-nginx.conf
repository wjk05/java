# Kubernetes 环境下的前端 Nginx 配置
# 与 frontend/nginx.conf 的区别：
#   1. 使用 $http_host 透传端口（否则后端生成的 WebSocket 地址会丢失 NodePort）
#   2. 增加 /ws/ 反向代理（语音通话 WebSocket）
#   3. 关闭 /api/ 的响应缓冲（SSE 流式输出必须）
#   4. 透传上游 X-Forwarded-Proto（Ingress 终止 TLS 时后端才能生成 wss://）

map $http_x_forwarded_proto $ruici_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $ruici_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss application/wasm
               image/svg+xml;

    # 支持较大的知识库 / 文档上传
    client_max_body_size 200m;

    # ---------- 后端 REST API ----------
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ruici_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        # SSE / 流式问答：必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # ---------- 语音交互 WebSocket ----------
    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ruici_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ruici_forwarded_proto;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- Swagger（可选，方便联调） ----------
    location /swagger-ui.html {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $ruici_forwarded_proto;
    }

    location /swagger-ui/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $ruici_forwarded_proto;
    }

    location /v3/api-docs {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $ruici_forwarded_proto;
    }

    # ---------- 前端 SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}